<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tumor Segmentation</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,Helvetica,sans-serif;
    background:#f5f7fa;color:#2c3e50;line-height:1.6;
  }

  .header{background:#2c3e50;color:#fff;padding:1.5rem 2rem;box-shadow:0 2px 4px rgba(0,0,0,.1)}
  .nav{max-width:1200px;margin:0 auto;display:flex;gap:1rem;align-items:center}
  .nav a{color:#fff;text-decoration:none;padding:.5rem 1rem;border-radius:4px}
  .nav a:hover{background:rgba(255,255,255,.08)}
  .nav a.active{background:#3498db}

  .container{max-width:1400px;margin:0 auto;padding:2rem}
  .title{background:#fff;padding:2rem;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:2rem;text-align:center}
  .title h1{font-size:2rem;color:#2c3e50;margin-bottom:.5rem}
  .title p{color:#7f8c8d}

  .info-box{background:#e8f4f8;border-left:4px solid #3498db;padding:1rem;border-radius:4px;margin-bottom:2rem}
  .info-box p{color:#2c3e50;font-size:.95rem}

  .main-grid{display:grid;grid-template-columns:400px 1fr;gap:2rem}
  .panel{background:#fff;border-radius:8px;padding:2rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .panel h2{color:#2c3e50;margin-bottom:1.5rem;font-size:1.3rem;padding-bottom:.75rem;border-bottom:2px solid #ecf0f1}

  .form-group{margin-bottom:1.5rem}
  .form-group label{display:block;margin-bottom:.5rem;color:#2c3e50;font-weight:500}
  .form-group select{width:100%;padding:.75rem;border:1px solid #ddd;border-radius:4px;background:#fff}

  /* Upload area improvements */
  .upload-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:.5rem;
    width:100%;
    min-height:160px;
    border:2px dashed #3498db;
    border-radius:8px;
    padding:1.5rem;
    text-align:center;
    background:#f8fbfc;
    cursor:pointer;
    transition:all .25s;
    overflow:hidden;
  }
  .upload-area:hover{border-color:#2980b9;background:#eef7fb}
  .upload-area .icon{font-size:2.5rem;color:#3498db}
  .upload-area .upload-text{font-weight:500;color:#2c3e50}
  .upload-area .upload-hint{font-size:.9rem;color:#7f8c8d}

  #imageUpload{display:none}

  .preview{margin-bottom:1.5rem;display:none}
  .preview.visible{display:block}
  .preview p{font-size:.9rem;color:#7f8c8d;margin-bottom:.5rem;font-weight:500}
  .preview img{max-width:100%;border-radius:4px;border:1px solid #ddd;display:block}

  .btn{width:100%;padding:.875rem;background:#3498db;color:#fff;border:0;border-radius:4px;font-size:1rem;font-weight:500;cursor:pointer;transition:background .2s}
  .btn:hover:not(:disabled){background:#2980b9}
  .btn:disabled{background:#bdc3c7;cursor:not-allowed}

  .status{padding:1rem;border-radius:4px;margin-bottom:1.5rem;font-size:.95rem}
  .status.info{background:#fff9e6;border-left:4px solid #f39c12;color:#7f6c00}
  .status.success{background:#e8f8f5;border-left:4px solid #27ae60;color:#0f5132}
  .status.error{background:#fde8e8;border-left:4px solid #e74c3c;color:#721c24}

  .mode-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1.5rem;padding:1rem;background:#f8f9fa;border-radius:4px}
  .mode-legend div{text-align:center;padding:.5rem;font-size:.9rem;font-weight:500}
  .mode-legend .blue{color:#3498db}
  .mode-legend .green{color:#27ae60}
  .mode-legend .red{color:#e74c3c}

  .result-area{background:#f8f9fa;border:1px solid #ddd;border-radius:4px;min-height:320px;display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem;padding:1rem;position:relative}
  .result-area img{max-width:100%;max-height:500px;border-radius:4px;display:none}
  .result-area.has-image img{display:block}
  .result-area .placeholder{color:#95a5a6;text-align:center}

  .download-btn{display:none;width:100%;padding:.875rem;background:#27ae60;color:#fff;text-decoration:none;text-align:center;border-radius:4px;font-weight:500;transition:background .2s}
  .download-btn:hover{background:#229954}

  .loader{border:3px solid #f3f3f3;border-top:3px solid #3498db;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;display:none;margin-left:.5rem}
  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

  .btn-content{display:flex;align-items:center;justify-content:center}

  @media (max-width:1024px){.main-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="header">
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/segmentation" class="active">Segmentation</a>
      <a href="/classification">Classification</a>
    </nav>
  </div>

  <div class="container">
    <div class="title">
      <h1>Tumor Segmentation</h1>
      <p>Identify and isolate tumor regions using deep learning</p>
    </div>


    <div class="main-grid">
      <div class="panel">
        <h2>Input & Configuration</h2>

        <div class="form-group">
          <label for="segmentationMode">Segmentation Algorithm</label>
          <select id="segmentationMode">
            <option value="UNet Only" selected>UNet Only</option>
            <option value="GrabCut">UNet + GrabCut</option>
            <option value="MaxFlow">UNet + MaxFlow</option>
          </select>
        </div>

        <label for="imageUpload" class="upload-area" title="Click to upload an image">
          <div class="icon">📤</div>
          <div class="upload-text">Upload MRI Image</div>
          <div class="upload-hint">Click to select file (PNG / JPG)</div>
          <input type="file" id="imageUpload" accept="image/png,image/jpeg">
        </label>

        <div id="previewContainer" class="preview">
          <p>Preview:</p>
          <img id="imagePreview" src="" alt="Preview">
        </div>

        <button id="analyzeButton" class="btn" disabled>
          <span class="btn-content">
            <span id="buttonText">Analyze Image</span>
            <div id="spinner" class="loader"></div>
          </span>
        </button>
      </div>

      <div class="panel">
        <h2>Results</h2>
        <div id="statusMessage" class="status info">Awaiting image upload to begin analysis.</div>

        <div class="mode-legend">
          <div class="blue">UNet (Blue)</div>
          <div class="green">GrabCut (Green)</div>
          <div class="red">MaxFlow (Red)</div>
        </div>

        <div id="resultContainer" class="result-area">
          <img id="resultImage" src="" alt="Result">
          <p id="placeholderText" class="placeholder">Segmentation result will appear here</p>
        </div>

        <a id="downloadLink" href="#" download="segmented_result.jpg" class="download-btn">📥 Download Result</a>
      </div>
    </div>
  </div>

<script src="/config.js"></script>
<script>
  const API_BASE_URL = (window.API_BASE_URL || 'https://brain-tumor-segmentation-b21n.onrender.com').replace(/\/$/, '');
  const API_URL = `${API_BASE_URL}/predict`;
  const imageUpload = document.getElementById('imageUpload');
  const imagePreview = document.getElementById('imagePreview');
  const previewContainer = document.getElementById('previewContainer');
  const analyzeButton = document.getElementById('analyzeButton');
  const resultImage = document.getElementById('resultImage');
  const resultContainer = document.getElementById('resultContainer');
  const placeholderText = document.getElementById('placeholderText');
  const statusMessage = document.getElementById('statusMessage');
  const spinner = document.getElementById('spinner');
  const buttonText = document.getElementById('buttonText');
  const downloadLink = document.getElementById('downloadLink');
  const segmentationMode = document.getElementById('segmentationMode');

  let selectedFile = null;
  function setLoading(isLoading) {
    analyzeButton.disabled = isLoading || !selectedFile;
    segmentationMode.disabled = isLoading;
    spinner.style.display = isLoading ? 'block' : 'none';
    buttonText.textContent = isLoading ? 'Processing...' : 'Analyze Image';
  }

  imageUpload.addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file) return;
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
      imagePreview.src = e.target.result;
      previewContainer.classList.add('visible');
      analyzeButton.disabled = false;
      statusMessage.className = 'status info';
      statusMessage.textContent = `File selected: ${file.name}. Ready to analyze.`;
      resultContainer.classList.remove('has-image');
      placeholderText.style.display = 'block';
      downloadLink.style.display = 'none';
    };
    reader.readAsDataURL(file);
  });

  analyzeButton.addEventListener('click', async () => {
    if (!selectedFile) return;
    setLoading(true);
    const selectedMode = segmentationMode.value;
    statusMessage.className = 'status info';
    statusMessage.textContent = `Processing image with ${selectedMode}... Please wait.`;
    const formData = new FormData();
    formData.append('file', selectedFile);
    formData.append('mode', selectedMode);

    try {
      const response = await fetch(API_URL, {method:'POST', body:formData});
      if (!response.ok) {
        const errorData = await response.json().catch(()=>({detail:'Request failed'}));
        throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
      }
      const data = await response.json();
      if (data.result_image) {
        const imageUrl = `data:image/jpeg;base64,${data.result_image}`;
        resultImage.src = imageUrl;
        resultContainer.classList.add('has-image');
        placeholderText.style.display = 'none';
        downloadLink.href = imageUrl;
        downloadLink.style.display = 'block';
        statusMessage.className = 'status success';
        statusMessage.textContent = `✓ ${data.message}`;
      } else throw new Error('No result image in response');
    } catch (error) {
      console.error('Error:', error);
      statusMessage.className = 'status error';
      statusMessage.textContent = `Error: ${error.message}`;
      resultContainer.classList.remove('has-image');
      placeholderText.style.display = 'block';
      downloadLink.style.display = 'none';
    } finally {
      setLoading(false);
    }
  });
</script>
</body>
</html>
